<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<title>Traduttore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;
  --border:#252525;--border-hi:#383838;
  --text:#f0ede8;--muted:#555;
  --accent:#e8d5a0;--accent-dim:#8a7a50;
  --green:#4caf78;--red:#e06060;
  --r:14px;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.logo{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.08em}
#lang-indicator{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
#lang-from,#lang-to{color:var(--text);font-weight:500}
.arr{color:var(--accent-dim)}

#status-bar{flex-shrink:0;height:26px;display:flex;align-items:center;padding:0 18px;gap:6px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent-dim);animation:pulse 1.2s ease-in-out infinite;flex-shrink:0}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
#status-text{font-size:11px;font-family:var(--mono);color:var(--muted)}
#status-bar.hidden{visibility:hidden}

main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.panel{flex:1;display:flex;flex-direction:column;padding:12px 18px;min-height:0}
.panel.output-panel{background:var(--surface)}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-shrink:0;gap:8px}
.panel-label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.panel-actions{display:flex;align-items:center;gap:8px}

/* MIC BUTTON */
#btn-mic{
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  background:transparent;border:1px solid var(--border-hi);
  cursor:pointer;transition:all .15s;flex-shrink:0
}
#btn-mic:hover{border-color:var(--accent-dim)}
#btn-mic:active{transform:scale(.9)}
#btn-mic.listening{
  border-color:var(--red);background:rgba(224,96,96,.1);
  animation:micpulse 1s ease-in-out infinite
}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(224,96,96,.35)}50%{box-shadow:0 0 0 7px rgba(224,96,96,0)}}
#btn-mic svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
#btn-mic.listening svg{stroke:var(--red)}

/* SPEAK BUTTON */
#btn-speak{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;
  background:transparent;border:1px solid var(--border-hi);
  cursor:pointer;transition:all .15s;flex-shrink:0
}
#btn-speak:hover:not(:disabled){border-color:var(--accent-dim)}
#btn-speak:active{transform:scale(.9)}
#btn-speak:disabled{opacity:.25;cursor:not-allowed}
#btn-speak.speaking{border-color:var(--accent);background:rgba(232,213,160,.08);animation:speakpulse 1s ease-in-out infinite}
@keyframes speakpulse{0%,100%{box-shadow:0 0 0 0 rgba(232,213,160,.3)}50%{box-shadow:0 0 0 6px rgba(232,213,160,0)}}
#btn-speak svg{width:15px;height:15px;fill:none;stroke:var(--accent-dim);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
#btn-speak.speaking svg{stroke:var(--accent)}

/* INTERIM (live dettatura) */
#interim{
  font-size:14px;font-style:italic;color:var(--accent-dim);
  min-height:20px;margin-bottom:4px;flex-shrink:0;
  transition:opacity .2s;opacity:0
}
#interim.active{opacity:1}

/* ACCENT ROW */
#accent-row{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-bottom:8px}
.accent-btn{
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  padding:3px 9px;border-radius:20px;
  background:transparent;border:1px solid var(--border);
  color:var(--muted);cursor:pointer;transition:all .15s
}
.accent-btn.active{border-color:var(--accent-dim);color:var(--accent);background:rgba(232,213,160,.07)}
.accent-btn:hover:not(.active){border-color:var(--border-hi);color:var(--text)}

textarea{
  flex:1;width:100%;background:transparent;border:none;outline:none;
  color:var(--text);font-family:var(--font);font-size:17px;font-weight:300;
  line-height:1.7;resize:none;caret-color:var(--accent);
  -webkit-appearance:none;overflow-y:auto;-webkit-overflow-scrolling:touch
}
textarea::placeholder{color:var(--muted)}

#output{
  flex:1;font-size:17px;font-weight:300;line-height:1.7;
  color:var(--text);white-space:pre-wrap;word-break:break-word;
  overflow-y:auto;-webkit-overflow-scrolling:touch
}
#output.empty{color:var(--muted);font-style:italic}

.divider{flex-shrink:0;height:1px;background:var(--border);position:relative;display:flex;align-items:center;justify-content:center}
.divider-btn{
  width:30px;height:30px;border-radius:50%;
  background:var(--surface2);border:1px solid var(--border-hi);
  display:flex;align-items:center;justify-content:center;
  position:absolute;cursor:pointer;transition:border-color .15s,transform .2s;z-index:1
}
.divider-btn:hover{border-color:var(--accent-dim)}
.divider-btn:active{transform:scale(.88)}
.divider-btn svg{width:14px;height:14px;fill:none;stroke:var(--accent-dim);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

footer{
  flex-shrink:0;display:flex;gap:10px;padding:12px 18px;
  padding-bottom:max(12px,env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:var(--bg)
}
.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  border:none;border-radius:var(--r);font-family:var(--font);
  font-size:15px;font-weight:400;cursor:pointer;
  transition:opacity .15s,transform .1s,background .15s,border-color .15s,color .15s;
  -webkit-user-select:none;user-select:none
}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn-copy{flex:1;background:var(--surface);color:var(--text);border:1px solid var(--border-hi);padding:14px 20px}
.btn-copy:hover:not(:disabled){border-color:var(--accent-dim)}
.btn-copy.copied{border-color:var(--green);color:var(--green)}
.btn-clear{background:var(--surface);color:var(--muted);border:1px solid var(--border);padding:14px 16px;min-width:50px}
.btn-clear:hover:not(:disabled){border-color:var(--border-hi);color:var(--text)}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</head>
<body>

<header>
  <div class="logo">TRANSLATE</div>
  <div id="lang-indicator">
    <span id="lang-from">IT</span>
    <span class="arr">→</span>
    <span id="lang-to">EN</span>
  </div>
</header>

<div id="status-bar" class="hidden">
  <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  <span id="status-text">traduzione in corso…</span>
</div>

<main>
  <div class="panel">
    <div class="panel-header">
      <div class="panel-label">Testo originale</div>
      <button id="btn-mic" onclick="toggleMic()" title="Dettatura vocale">
        <svg viewBox="0 0 24 24">
          <rect x="9" y="2" width="6" height="11" rx="3"/>
          <path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
      </button>
    </div>
    <div id="interim"></div>
    <textarea id="input" placeholder="Scrivi, detta con il microfono, o incolla da WhatsApp…" spellcheck="true"></textarea>
  </div>

  <div class="divider">
    <div class="divider-btn" onclick="swapLangs()" title="Inverti lingue">
      <svg viewBox="0 0 16 16"><path d="M3 5h10M9 2l4 3-4 3M13 11H3M7 8l-4 3 4 3"/></svg>
    </div>
  </div>

  <div class="panel output-panel">
    <div class="panel-header">
      <div class="panel-label">Traduzione</div>
      <button id="btn-speak" onclick="toggleSpeak()" disabled title="Ascolta pronuncia">
        <svg id="speak-icon" viewBox="0 0 24 24">
          <path d="M11 5L6 9H2v6h4l5 4V5z"/>
          <path d="M19.07 4.93a10 10 0 010 14.14"/>
          <path d="M15.54 8.46a5 5 0 010 7.07"/>
        </svg>
      </button>
    </div>
    <div id="accent-row">
      <button class="accent-btn active" data-accent="en-US" onclick="setAccent(this)">🇺🇸 US</button>
      <button class="accent-btn" data-accent="en-GB" onclick="setAccent(this)">🇬🇧 UK</button>
      <button class="accent-btn" data-accent="en-AU" onclick="setAccent(this)">🇦🇺 AU</button>
    </div>
    <div id="output" class="empty">La traduzione apparirà qui…</div>
  </div>
</main>

<footer>
  <button class="btn btn-clear" onclick="clearAll()">
    <svg class="ic" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <button class="btn btn-copy" id="btn-copy" onclick="copyText()" disabled>
    <svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
    Copia traduzione
  </button>
</footer>

<script>
const inputEl   = document.getElementById('input');
const outputEl  = document.getElementById('output');
const interimEl = document.getElementById('interim');
const btnCopy   = document.getElementById('btn-copy');
const btnSpeak  = document.getElementById('btn-speak');
const btnMic    = document.getElementById('btn-mic');
const statusBar = document.getElementById('status-bar');
const langFromEl= document.getElementById('lang-from');
const langToEl  = document.getElementById('lang-to');

let translated     = '';
let debounceTimer  = null;
let lastText       = '';
let manualSwap     = false;
let sourceLang     = 'it';
let targetLang     = 'en-GB';
let selectedAccent = 'en-US';
let speaking       = false;
let listening      = false;
let recognition    = null;

// ── PUNCTUATION MAP ─────────────────────────────────
const PUNCT = {
  'virgola'            : ',',
  'punto'              : '.',
  'punto esclamativo'  : '!',
  'punto interrogativo': '?',
  'due punti'          : ':',
  'punto e virgola'    : ';',
  'a capo'             : '\n',
  'nuova riga'         : '\n',
  'apri parentesi'     : '(',
  'chiudi parentesi'   : ')',
  'apri virgolette'    : '"',
  'chiudi virgolette'  : '"',
  'trattino'           : '-',
  'puntini di sospensione': '…',
  'cancella'           : '{DEL}',
  'cancella tutto'     : '{CLEAR}',
};

function applyPunctuation(raw) {
  // Sort keys longest-first to match multi-word commands first
  const keys = Object.keys(PUNCT).sort((a,b) => b.length - a.length);
  const pattern = new RegExp('\\b(' + keys.map(k => k.replace(/[.*+?^${}()|[\]\\]/g,'\$&')).join('|') + ')\\b', 'gi');

  let result = raw.replace(pattern, (match) => {
    const cmd = match.toLowerCase();
    const sym = PUNCT[cmd];
    if (sym === '{DEL}')   return '\x00DEL\x00';
    if (sym === '{CLEAR}') return '\x00CLEAR\x00';
    return sym;
  });

  // Handle special commands
  if (result.includes('\x00CLEAR\x00')) return '';
  result = result.replace(/\x00DEL\x00/g, ''); // simplified: remove last word handled below

  // Clean up spaces before punctuation
  result = result.replace(/\s+([,\.!?:;\)])/g, '$1');
  result = result.replace(/\(\s+/g, '(');
  // Capitalize after sentence-ending punctuation
  result = result.replace(/([.!?]\s+)(\w)/g, (m, p, c) => p + c.toUpperCase());
  // Capitalize after newline
  result = result.replace(/(\n)(\w)/g, (m, n, c) => n + c.toUpperCase());

  return result.trim();
}

// ── SPEECH RECOGNITION ──────────────────────────────
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = 'it-IT';
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;

  r.onstart = () => {
    listening = true;
    btnMic.classList.add('listening');
    interimEl.textContent = '🎙 in ascolto…';
    interimEl.classList.add('active');
  };

  r.onend = () => {
    if (listening) r.start(); // keep alive
  };

  r.onerror = (e) => {
    if (e.error === 'not-allowed') {
      alert('Microfono non autorizzato. Controlla i permessi del browser.');
      stopMic();
    }
  };

  r.onresult = (e) => {
    let interim = '';
    let final   = '';

    for (let i = e.resultIndex; i < e.results.length; i++) {
      const txt = e.results[i][0].transcript;
      if (e.results[i].isFinal) { final += txt + ' '; }
      else { interim = txt; }
    }

    // Show interim live
    if (interim) {
      interimEl.textContent = '🎙 ' + interim;
      interimEl.classList.add('active');
    }

    if (final) {
      const processed = applyPunctuation(final);

      if (processed === '') {
        inputEl.value = '';
      } else if (processed === '\x00CLEAR\x00') {
        inputEl.value = '';
      } else {
        const cur = inputEl.value;
        // Smart join: if current ends with sentence punctuation or is empty, capitalize
        const needsCap = !cur || /[.!?\n]\s*$/.test(cur);
        const word = needsCap ? processed.charAt(0).toUpperCase() + processed.slice(1) : processed;
        // Add space separator if needed
        const sep = cur && !/[\s\n]$/.test(cur) && !word.startsWith('\n') ? ' ' : '';
        inputEl.value = cur + sep + word;
      }

      interimEl.textContent = '';
      interimEl.classList.remove('active');
      triggerTranslation(false);
    }
  };

  return r;
}

function toggleMic() {
  if (!listening) { startMic(); } else { stopMic(); }
}

function startMic() {
  stopSpeak();
  if (!recognition) recognition = initRecognition();
  if (!recognition) { alert('Dettatura non supportata su questo browser.'); return; }
  try { recognition.start(); } catch(e) {}
}

function stopMic() {
  listening = false;
  btnMic.classList.remove('listening');
  interimEl.textContent = '';
  interimEl.classList.remove('active');
  if (recognition) { try { recognition.stop(); } catch(e){} }
}

// ── TTS ─────────────────────────────────────────────
const synth = window.speechSynthesis;

function getBestVoice(accent) {
  const voices = synth.getVoices();
  const males = ['david','mark','daniel','alex','fred','thomas','oliver','rishi','aaron','arthur','lee','nicky','tom'];
  let pool = voices.filter(v => v.lang.toLowerCase().startsWith(accent.toLowerCase().split('-')[0]));
  const exact = pool.filter(v => v.lang.toLowerCase() === accent.toLowerCase());
  if (exact.length) pool = exact;
  return pool.find(v => males.some(m => v.name.toLowerCase().includes(m))) || pool[0] || null;
}

function speak() {
  if (!translated || !synth) return;
  synth.cancel();
  const utt = new SpeechSynthesisUtterance(translated);
  utt.lang  = selectedAccent;
  utt.rate  = 0.92;
  utt.pitch = 0.95;
  const go = () => { const v = getBestVoice(selectedAccent); if (v) utt.voice = v; synth.speak(utt); };
  synth.getVoices().length ? go() : synth.addEventListener('voiceschanged', go, {once:true});
  utt.onstart = () => { speaking = true;  btnSpeak.classList.add('speaking');    setSpeakIcon(true); };
  utt.onend   = () => { speaking = false; btnSpeak.classList.remove('speaking'); setSpeakIcon(false); };
  utt.onerror = () => { speaking = false; btnSpeak.classList.remove('speaking'); setSpeakIcon(false); };
}

function stopSpeak() {
  if (synth) synth.cancel();
  speaking = false;
  btnSpeak.classList.remove('speaking');
  setSpeakIcon(false);
}

function toggleSpeak() { speaking ? stopSpeak() : speak(); }

function setSpeakIcon(active) {
  document.getElementById('speak-icon').innerHTML = active
    ? '<path d="M18 12h.01"/><path d="M6 12a6 6 0 0112 0"/><path d="M3 12a9 9 0 0118 0"/><line x1="12" y1="12" x2="12" y2="12.01"/>'
    : '<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14"/><path d="M15.54 8.46a5 5 0 010 7.07"/>';
}

function setAccent(el) {
  document.querySelectorAll('.accent-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedAccent = el.dataset.accent;
  if (speaking) { stopSpeak(); speak(); }
}

// ── LANG DETECTION ───────────────────────────────────
const IT_RE = /\b(che|con|per|una|sono|della|degli|delle|questo|questa|però|anche|ancora|quando|dove|come|cosa|tutto|tutti|molto|bene|grazie|prego|ciao|allora|quindi|mentre|dopo|prima|sempre|già|loro|noi|voi|essere|avere|fare|dire|andare|venire|sapere|volere|potere|dovere|non|nel|nella|nei|nelle|gli|dal|dalla|dai|alle|alla|agli|sulla|sulle|suoi|mio|mia|miei|tue|suo|nostra)\b/gi;
const EN_RE = /\b(the|and|for|that|this|with|have|from|they|will|would|could|should|about|there|their|what|your|which|when|where|been|also|more|some|into|than|then|them|these|those|just|like|only|after|because|however|while|since|every|never|always|already|very|well|good|thank|please|hello|okay|yeah|sure|right|know|want|need|think|make|take|come|back|work|look|time|people|going|being|said|made)\b/gi;

function detectLang(text) {
  if (manualSwap) return sourceLang;
  const it = (text.match(IT_RE)||[]).length;
  const en = (text.match(EN_RE)||[]).length;
  return (!it && !en) ? sourceLang : (it >= en ? 'it' : 'en');
}

function updateBadge(from, to) {
  langFromEl.textContent = from.toUpperCase().split('-')[0];
  langToEl.textContent   = to.toUpperCase().split('-')[0];
}

function swapLangs() {
  stopSpeak(); stopMic();
  manualSwap = true;
  const prev = sourceLang;
  sourceLang = targetLang.split('-')[0];
  targetLang = prev === 'it' ? 'en-GB' : 'it';
  updateBadge(sourceLang, targetLang);
  if (inputEl.value.trim()) triggerTranslation(true);
}

// ── TRANSLATE ────────────────────────────────────────
function setStatus(show) { statusBar.classList.toggle('hidden', !show); }

async function doTranslate(text) {
  stopSpeak();
  const from = detectLang(text);
  const to   = from === 'it' ? 'en-GB' : 'it';
  if (!manualSwap) { sourceLang = from; targetLang = to; updateBadge(from, to); }
  setStatus(true);
  try {
    const res  = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + from + '|' + to);
    const data = await res.json();
    if (data.responseStatus === 200) {
      translated = data.responseData.translatedText;
      outputEl.className = '';
      outputEl.textContent = translated;
      btnCopy.disabled  = false;
      btnSpeak.disabled = false;
    } else { showError('Errore nella traduzione.'); }
  } catch(e) { showError('Nessuna connessione.'); }
  setStatus(false);
}

function showError(msg) {
  outputEl.className = 'empty'; outputEl.textContent = msg;
  translated = ''; btnCopy.disabled = true; btnSpeak.disabled = true;
}

function triggerTranslation(immediate) {
  const text = inputEl.value.trim();
  if (!text) { clearOutput(); return; }
  if (text === lastText) return;
  lastText = text;
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => doTranslate(text), immediate ? 50 : 700);
}

inputEl.addEventListener('input', () => triggerTranslation(false));
inputEl.addEventListener('paste', () => setTimeout(() => triggerTranslation(true), 30));

// ── UTILS ────────────────────────────────────────────
function clearOutput() {
  stopSpeak();
  outputEl.className = 'empty'; outputEl.textContent = 'La traduzione apparirà qui…';
  translated = ''; btnCopy.disabled = true; btnSpeak.disabled = true;
  lastText = ''; setStatus(false);
}

function clearAll() {
  stopMic(); stopSpeak();
  inputEl.value = '';
  interimEl.textContent = ''; interimEl.classList.remove('active');
  manualSwap = false; sourceLang = 'it'; targetLang = 'en-GB';
  updateBadge('it','en');
  clearOutput(); clearTimeout(debounceTimer);
  inputEl.focus();
}

function copyText() {
  if (!translated) return;
  navigator.clipboard.writeText(translated).then(() => {
    btnCopy.classList.add('copied');
    btnCopy.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg> Copiato!';
    setTimeout(() => {
      btnCopy.classList.remove('copied');
      btnCopy.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copia traduzione';
    }, 2000);
  }).catch(() => {
    const sel = window.getSelection(), range = document.createRange();
    range.selectNodeContents(outputEl); sel.removeAllRanges(); sel.addRange(range);
  });
}

if (synth) { synth.getVoices(); synth.addEventListener('voiceschanged', () => synth.getVoices()); }
</script>
